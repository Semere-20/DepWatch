[project]
name = "depwatch"
version = "1.0.0"
description = "Scan a requirements.txt against the OSV vulnerability database and rank findings by severity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.0", "matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
